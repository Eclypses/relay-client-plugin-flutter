name: mte_relay
description: "A Flutter Plugin, implementing the Eclypses AWS MteRelay Client."
version: 5.3.0
homepage:

environment:
  sdk: ^3.7.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.eclypses.mte_relay
        pluginClass: MteRelayClientPlugin
      ios:
        pluginClass: MteRelayClientPlugin

